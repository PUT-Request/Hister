# Generated by open-dynamic-workflow init.
concurrency: 4
defaultProvider: opencode
failFast: false
outDir: .open-dynamic-workflow/runs
providers:
  mock:
    args: []
    command: mock
    defaultModel: null
    responses:
      default:
        text: mock response
  opencode:
    args:
      - run
      - --format
      - json
    command: opencode
    defaultModel: null
    modelArg:
      flag: --model
    permissionPolicy: read-only
    promptMode: arg
reporting:
  mode: pretty
  verbose: false
security:
  allowWorkflowImports: false
  passEnv: []
  redactEnv:
    - OPENAI_API_KEY
    - GEMINI_API_KEY
    - GOOGLE_API_KEY
    - "*_KEY"
    - "*_TOKEN"
    - "*_SECRET"
    - PASSWORD
sharedAgents:
  allowDynamicIds: false
  include:
    - .open-dynamic-workflow/agents/**/*.js
    - .open-dynamic-workflow/agents/**/*.ts
  maxDefinitions: 100
  strictPromptTemplateVariables: true
timeoutMs: 900000
tools:
  concurrency: 4
  include:
    - .open-dynamic-workflow/tools/**/*.js
    - .open-dynamic-workflow/tools/**/*.ts
  maxDefinitions: 100
workflow:
  include:
    - workflows/**/*.workflow.js
    - workflows/**/*.workflow.ts
  maxDepth: 8
  maxLoopRounds: 20
